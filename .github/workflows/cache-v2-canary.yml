name: Cache v2 canary

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cache-v2-canary
  cancel-in-progress: false

jobs:
  upload:
    name: Upload mixed CAS and AC records
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      accepted_at: ${{ steps.put.outputs.accepted_at }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start writable cache adapter
        id: cache
        uses: ./
        with:
          namespace: canary-v1-${{ github.run_id }}-${{ github.run_attempt }}
          mode: read-write
          storage-mode: pack
          github-token: ${{ github.token }}
          upload-diagnostics: never
          max-object-size: '8388608'
          max-inflight-bytes: '8388608'
          max-pending-bytes: '16777216'
          pack-target-bytes: '16777216'
          pack-max-objects: '2'
          pack-max-age-seconds: '300'
          upload-concurrency: '1'
          download-concurrency: '1'
          fail-job-on-cache-error: 'true'

      - name: Upload CAS then AC bytes
        id: put
        shell: bash
        env:
          CACHE_URL: ${{ steps.cache.outputs.url }}
          CACHE_READABLE: ${{ steps.cache.outputs.readable }}
          CACHE_WRITABLE: ${{ steps.cache.outputs.writable }}
        run: |
          set -euo pipefail

          test "$CACHE_READABLE" = true
          test "$CACHE_WRITABLE" = true

          cas_payload="$RUNNER_TEMP/cache-v2-canary.cas"
          action_key="$RUNNER_TEMP/cache-v2-canary.action-key"
          action_payload="$RUNNER_TEMP/cache-v2-canary.ac"
          printf 'bazel-gha-remote-cache canary\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$cas_payload"
          dd if=/dev/zero bs=1048576 count=4 >>"$cas_payload" 2>/dev/null
          printf 'bazel-gha-remote-cache action key\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$action_key"
          # build.bazel.remote.execution.v2.ActionResult with exit_code 1 and
          # 4 MiB of stdout_raw, large enough to force a mid-response close.
          printf '\040\001\052\200\200\200\002' >"$action_payload"
          dd if=/dev/zero bs=1048576 count=4 >>"$action_payload" 2>/dev/null

          cas_digest="$(sha256sum "$cas_payload" | cut -d ' ' -f 1)"
          action_digest="$(sha256sum "$action_key" | cut -d ' ' -f 1)"
          action_body_digest="$(sha256sum "$action_payload" | cut -d ' ' -f 1)"
          test "$action_digest" != "$action_body_digest"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 60 \
            --request PUT \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$cas_payload" \
            "${CACHE_URL%/}/cas/$cas_digest"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 60 \
            --request PUT \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$action_payload" \
            "${CACHE_URL%/}/ac/$action_digest"

          echo "accepted_at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

  download:
    name: Verify one mixed pack from a fresh runner
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      diagnostics_artifact_name: ${{ steps.cache.outputs.diagnostics-artifact-name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start read-only cache adapter
        id: cache
        uses: ./
        with:
          namespace: canary-v1-${{ github.run_id }}-${{ github.run_attempt }}
          mode: read-only
          storage-mode: pack
          github-token: ${{ github.token }}
          upload-diagnostics: on-error
          diagnostics-retention-days: '1'
          max-object-size: '8388608'
          max-inflight-bytes: '8388608'
          max-pending-bytes: '16777216'
          pack-target-bytes: '16777216'
          catalog-refresh-seconds: '15'
          upload-concurrency: '1'
          download-concurrency: '1'
          fail-job-on-cache-error: 'true'

      - name: Download and verify AC and CAS bytes
        shell: bash
        env:
          CACHE_URL: ${{ steps.cache.outputs.url }}
          CACHE_READABLE: ${{ steps.cache.outputs.readable }}
          CACHE_WRITABLE: ${{ steps.cache.outputs.writable }}
          ACCEPTED_AT: ${{ needs.upload.outputs.accepted_at }}
          CACHE_NAMESPACE: canary-v1-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$CACHE_READABLE" = true
          test "$CACHE_WRITABLE" = false
          [[ "$ACCEPTED_AT" =~ ^[0-9]+$ ]]

          expected_cas="$RUNNER_TEMP/cache-v2-canary.expected.cas"
          action_key="$RUNNER_TEMP/cache-v2-canary.action-key"
          expected_ac="$RUNNER_TEMP/cache-v2-canary.expected.ac"
          actual_cas="$RUNNER_TEMP/cache-v2-canary.actual.cas"
          actual_ac="$RUNNER_TEMP/cache-v2-canary.actual.ac"
          printf 'bazel-gha-remote-cache canary\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$expected_cas"
          dd if=/dev/zero bs=1048576 count=4 >>"$expected_cas" 2>/dev/null
          printf 'bazel-gha-remote-cache action key\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$action_key"
          # build.bazel.remote.execution.v2.ActionResult with exit_code 1 and
          # 4 MiB of stdout_raw, large enough to force a mid-response close.
          printf '\040\001\052\200\200\200\002' >"$expected_ac"
          dd if=/dev/zero bs=1048576 count=4 >>"$expected_ac" 2>/dev/null

          cas_digest="$(sha256sum "$expected_cas" | cut -d ' ' -f 1)"
          action_digest="$(sha256sum "$action_key" | cut -d ' ' -f 1)"
          action_body_digest="$(sha256sum "$expected_ac" | cut -d ' ' -f 1)"
          test "$action_digest" != "$action_body_digest"

          ac_ready=0
          cas_ready=0
          for attempt in {1..12}; do
            if [[ "$ac_ready" -eq 0 ]] && curl \
              --silent \
              --show-error \
              --fail \
              --max-time 60 \
              --output "$actual_ac" \
              "${CACHE_URL%/}/ac/$action_digest"; then
              ac_ready=1
            fi
            if [[ "$cas_ready" -eq 0 ]] && curl \
              --silent \
              --show-error \
              --fail \
              --max-time 60 \
              --output "$actual_cas" \
              "${CACHE_URL%/}/cas/$cas_digest"; then
              cas_ready=1
            fi
            if [[ "$ac_ready" -eq 1 && "$cas_ready" -eq 1 ]]; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo 'The finalized mixed pack was not readable after 12 attempts.' >&2
              exit 1
            fi
            sleep 5
          done

          cmp --silent "$expected_ac" "$actual_ac"
          cmp --silent "$expected_cas" "$actual_cas"

          health_url="${CACHE_URL%/cache}/healthz"
          client_aborted_before="$(curl \
            --silent \
            --show-error \
            --fail \
            --max-time 5 \
            "$health_url" | jq -er '.clientAbortedRequests')"
          test "$client_aborted_before" -eq 0

          set +e
          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 60 \
            "${CACHE_URL%/}/ac/$action_digest" | head -c 1 >/dev/null
          cancellation_statuses=("${PIPESTATUS[@]}")
          set -e
          test "${cancellation_statuses[0]}" -ne 0
          test "${cancellation_statuses[1]}" -eq 0

          client_aborted_requests=0
          for attempt in {1..20}; do
            client_aborted_requests="$(curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              "$health_url" | \
              jq -er '.clientAbortedRequests')"
            if ((client_aborted_requests >= client_aborted_before + 1)); then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo 'The daemon did not observe the cancelled packed GET.' >&2
              exit 1
            fi
            sleep 0.25
          done

          namespace_hash="$(printf '%s' "$CACHE_NAMESPACE" | sha256sum | cut -c1-16)"
          pack_prefix="brc2-${namespace_hash}-pack-"
          catalog="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f key="$pack_prefix" \
            -f ref="$GITHUB_REF" \
            -f sort=created_at \
            -f direction=desc \
            -F per_page=100)"
          pack_count="$(jq \
            --arg prefix "$pack_prefix" \
            '[.actions_caches[] | select(.key | startswith($prefix))] | length' \
            <<<"$catalog")"
          test "$pack_count" -eq 1

          pack_version="$(jq -er \
            --arg prefix "$pack_prefix" \
            '.actions_caches[] | select(.key | startswith($prefix)) | .version' \
            <<<"$catalog")"
          test "$pack_version" = \
            '0e4776d7b2559968a535effc3462cb6a4d646d333ac10e31ecb38b97e6c2f3af'

          pack_bytes="$(jq -er \
            --arg prefix "$pack_prefix" \
            '.actions_caches[] | select(.key | startswith($prefix)) | .size_in_bytes' \
            <<<"$catalog")"
          cas_bytes="$(wc -c <"$expected_cas")"
          ac_bytes="$(wc -c <"$expected_ac")"
          expected_pack_bytes="$((cas_bytes + ac_bytes + 16 + 2 * 96 + 64))"
          test "$pack_bytes" -eq "$expected_pack_bytes"

          verified_at="$(date -u +%s)"
          latency_seconds="$((verified_at - ACCEPTED_AT))"
          {
            echo '### Cache v2 cross-job canary'
            echo
            echo "Verified 2 Bazel objects (CAS + AC) in exactly 1 GitHub Cache v2 pack entry ${latency_seconds}s after local acceptance, including a benign client-cancelled packed GET."
          } >>"$GITHUB_STEP_SUMMARY"

  diagnostics_error:
    name: Produce diagnostics for a rejected CAS upload
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      diagnostics_artifact_name: ${{ steps.cache.outputs.diagnostics-artifact-name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start cache adapter with error diagnostics
        id: cache
        uses: ./
        with:
          namespace: diagnostics-canary-${{ github.run_id }}-${{ github.run_attempt }}
          mode: read-write
          storage-mode: pack
          github-token: ${{ github.token }}
          upload-diagnostics: on-error
          diagnostics-retention-days: '1'
          max-object-size: '1048576'
          max-inflight-bytes: '1048576'
          max-pending-bytes: '1048576'
          pack-target-bytes: '1048576'
          fail-job-on-cache-error: 'false'

      - name: Send a mismatched CAS object
        shell: bash
        env:
          CACHE_URL: ${{ steps.cache.outputs.url }}
          CACHE_WRITABLE: ${{ steps.cache.outputs.writable }}
        run: |
          set -euo pipefail

          test "$CACHE_WRITABLE" = true

          payload="$RUNNER_TEMP/diagnostics-canary.cas"
          response_body="$RUNNER_TEMP/diagnostics-canary.response"
          printf 'intentional CAS digest mismatch\n' >"$payload"

          actual_digest="$(sha256sum "$payload" | cut -d ' ' -f 1)"
          if [[ "${actual_digest:0:1}" = 0 ]]; then
            mismatched_digest="1${actual_digest:1}"
          else
            mismatched_digest="0${actual_digest:1}"
          fi

          status="$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --output "$response_body" \
            --write-out '%{http_code}' \
            --request PUT \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$payload" \
            "${CACHE_URL%/}/cas/$mismatched_digest")"

          test "$status" = 400

  diagnostics_verify:
    name: Verify diagnostics from a fresh runner
    needs: [diagnostics_error, download]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download diagnostics artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.diagnostics_error.outputs.diagnostics_artifact_name }}
          path: diagnostics-artifact

      - name: Validate diagnostics schema, error, and redaction
        shell: bash
        env:
          CANCELLATION_DIAGNOSTICS_NAME: ${{ needs.download.outputs.diagnostics_artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          diagnostics='diagnostics-artifact/diagnostics.json'
          test -f "$diagnostics"
          test "$(find diagnostics-artifact -type f | wc -l | tr -d ' ')" -eq 1

          jq -e '
            .schemaVersion == 1 and
            (.metrics.schemaVersion == 3) and
            (.metrics.integrityFailures >= 1) and
            any(
              .errors[]?;
              .area == "http" and
              .operation == "put" and
              .kind == "cas" and
              .message == "CAS digest did not match request bytes"
            )
          ' "$diagnostics" >/dev/null

          if grep -Eiq \
            'daemon-config\.json|shutdown[-_]?token|runtime[-_]?token|github[-_]?token|github_pat_|authorization|bearer|https?://|[0-9a-f]{64}|[?&](sig|signature|token|se|sp|sv)=' \
            "$diagnostics"; then
            echo 'Diagnostics artifact contains forbidden sensitive data.' >&2
            exit 1
          fi

          [[ "$CANCELLATION_DIAGNOSTICS_NAME" =~ \
            ^bazel-gha-remote-cache-diagnostics-${GITHUB_RUN_ID}-[0-9a-f]{16}$ ]]

          artifacts="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            -F per_page=100)"
          cancellation_artifacts="$(jq \
            --arg name "$CANCELLATION_DIAGNOSTICS_NAME" \
            '[.artifacts[] | select(.name == $name)] | length' \
            <<<"$artifacts")"
          test "$cancellation_artifacts" -eq 0
