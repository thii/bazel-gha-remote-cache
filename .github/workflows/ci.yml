name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove committed action bundles before rebuilding
        run: rm -rf dist

      - name: Check sources and build action bundles
        run: npm run check

      - name: Verify committed action bundles
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- dist)" ]]; then
            echo "dist/ is not up to date; run 'npm run build' and commit it." >&2
            git status --short -- dist
            exit 1
          fi
